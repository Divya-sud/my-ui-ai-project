<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dynamic Retina UI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Inter:wght@400;600&family=Playfair+Display&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
</head>
<body>
<div class="card">
    <h1 id="ui-heading">AI Retina Engine</h1>
    <p id="ui-desc">Tracking eye dynamics and updating stylesheet tokens using Ollama.</p>

    <div class="metrics">
        <span>Pupil: <b id="val-pupil">4.0mm</b></span>
        <span>Gaze: <b id="val-gaze">500, 300</b></span>
    </div>

    <button id="scan-btn" onclick="triggerScan()">Scan Retina & Adapt Theme</button>
</div>

<script src="js/dynamic-ui.js"></script>
</body>
</html>
